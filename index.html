  --display:'Lilita One','Arial Rounded MT Bold',system-ui,sans-serif;
  --text:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--text);color:var(--ink);min-height:100vh;
  background:var(--grass-deep);
  background-image:radial-gradient(120% 70% at 50% 0%,#24604A 0%,var(--grass-deep) 60%);
  display:flex;justify-content:center;align-items:flex-start;padding:56px 16px 40px;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

.app{width:100%;max-width:760px}
.screen{display:none}
.screen.active{display:block}
.panel{background:var(--panel);border-radius:28px;padding:36px 32px;box-shadow:0 18px 0 -6px rgba(0,0,0,.18)}

/* Buttons */
.btn{border:0;border-radius:16px;padding:16px 26px;font-family:var(--display);font-size:22px;letter-spacing:.01em;
  background:var(--ink);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-red{background:var(--berry);box-shadow:0 5px 0 var(--berry-dark)}
.btn-red:active{box-shadow:0 2px 0 var(--berry-dark)}
.btn-ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn-ghost:active{box-shadow:inset 0 0 0 2px var(--ink-soft)}
.btn-small{font-size:17px;padding:10px 16px;border-radius:12px}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:24px}
.link{background:none;border:0;color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:4px}

/* Tiles */
.tiles{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;perspective:600px}
.slot{display:flex;flex-direction:column;align-items:center;gap:6px;width:var(--tw,56px)}
.gap{width:calc(var(--tw,56px) * .4)}
.tile{position:relative;width:100%;aspect-ratio:4/5;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.tile .face{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;display:grid;place-items:center}
.tile .back{
  background:#E3F2DC var(--grass-img) center bottom 2px / 118% auto no-repeat;
  box-shadow:inset 0 0 0 2px #C6E3BC,inset 0 -6px 0 #A9D49C;
}
.tile .front{background:var(--tile);transform:rotateY(180deg);box-shadow:inset 0 0 0 2px var(--line),inset 0 -6px 0 var(--line);
  font-family:var(--display);font-size:calc(var(--tw,56px) * .62);line-height:1;color:var(--ink);padding-bottom:4px}
.tile.open{transform:rotateY(180deg)}
.tile.static .back{display:none}
.hint{font-weight:700;font-size:17px;color:var(--ink-soft);min-height:22px;font-variant-numeric:tabular-nums}

/* Menu */
.me-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-8px -6px 18px;font-size:17px}
.me-row span{display:flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--pc);display:inline-block;flex:none}
.menu-top{text-align:center;padding:4px 0}
.kicker{font-family:var(--display);font-size:30px;color:var(--berry);margin-bottom:14px}
.title-tiles .slot{gap:0}
.tagline{margin:22px auto 0;max-width:30ch;text-align:center;font-size:19px;color:var(--ink-soft);line-height:1.45}
.menu-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:30px}
.menu-actions .btn{width:100%}
.menu-links{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:14px}

/* Who's playing */
.who-list{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.who{width:100%;display:flex;align-items:center;gap:10px;text-align:left;border:0;background:#fff;border-radius:16px;padding:16px;box-shadow:inset 0 0 0 2px var(--line),inset 0 -5px 0 var(--pc)}
.who .dot{width:16px;height:16px}
.who b{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1;display:block}
.who small{color:var(--ink-soft);font-size:15px}
.who-wrap{position:relative}
.who-remove{position:absolute;top:-8px;right:-8px;border:0;background:var(--berry);color:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}
.add-row{display:flex;gap:10px;margin-top:18px}
.add-row input{flex:1;min-width:0;padding:13px 16px;border:2px solid var(--line);border-radius:14px;background:#fff;font-size:18px}
.add-row input:focus{border-color:var(--grass-deep);outline:none}

/* Setup */
h2{font-family:var(--display);font-size:34px;font-weight:400;line-height:1.1;margin-bottom:6px}
.sub{color:var(--ink-soft);font-size:17px;margin-bottom:24px}
.field{margin-top:22px}
.field > .label{font-weight:700;font-size:17px;margin-bottom:8px;display:block}
.seg{display:flex;background:#E4EEE6;border-radius:14px;padding:4px;gap:4px}
.seg label{flex:1;text-align:center;position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:11px 8px;border-radius:11px;font-weight:700;font-size:17px;cursor:pointer;color:var(--ink-soft);transition:background .15s,color .15s}
.seg input:checked + span{background:#fff;color:var(--ink);box-shadow:0 2px 0 var(--line)}
.seg input:focus-visible + span{outline:3px solid var(--sun);outline-offset:1px}
.note{font-size:15px;color:var(--ink-soft);margin-top:8px;min-height:20px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.names input{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:17px}
.names input:focus{border-color:var(--grass-deep);outline:none}

/* Game */
.hud{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.hud-left{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;flex:1;min-width:0}
.hud-mode{font-weight:700;color:var(--ink-soft);font-size:16px}
.streak{background:var(--sun);border-radius:999px;padding:4px 12px;font-weight:700;font-size:15px;animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
.hud-right{display:flex;align-items:center;gap:10px;flex:none}
.clock{font-family:var(--display);font-size:28px;min-width:72px;text-align:right;font-variant-numeric:tabular-nums}
.clock.warn{color:var(--berry)}
.players{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.pl{flex:1;min-width:120px;padding:10px 12px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 2px var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.pl > span{display:flex;align-items:center;gap:6px}
.pl b{font-variant-numeric:tabular-nums}
.pl.turn{box-shadow:inset 0 0 0 3px var(--pc)}
.pl.out{opacity:.4}
.board{padding:6px 0 26px}
.play{background:#fff;border-radius:22px;box-shadow:inset 0 0 0 2px var(--line);padding:26px 20px;text-align:center}
.play.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.problem{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.expr{font-weight:700;font-size:56px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.ans{width:130px;font-weight:700;font-size:48px;text-align:center;padding:6px 8px;border:3px solid var(--line);border-radius:16px;background:var(--panel)}
.ans:focus{border-color:var(--grass-deep);outline:none;background:#fff}
.touch .ans{caret-color:transparent}
.play > .btn{margin-top:18px;min-width:180px}
.msg{min-height:28px;margin-top:14px;font-weight:700;font-size:19px}
.msg.good{color:var(--good)}
.msg.bad{color:var(--berry)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:330px;margin:16px auto 0}
.pad button{border:0;border-radius:14px;background:var(--panel);box-shadow:inset 0 0 0 2px var(--line),inset 0 -4px 0 var(--line);font-weight:700;font-size:28px;height:58px;font-variant-numeric:tabular-nums}
.pad button:active{background:var(--line)}
.pad .ok{background:var(--berry);color:#fff;box-shadow:inset 0 -4px 0 var(--berry-dark);font-family:var(--display);font-weight:400;font-size:22px}
.pad .ok:active{background:var(--berry-dark)}
.pad button:disabled{opacity:.45}
.guess{margin-top:16px;display:flex;gap:10px}
.guess input{flex:1;min-width:0;padding:13px 16px;border:2px solid var(--line);border-radius:14px;background:#fff;font-size:18px;text-transform:uppercase}
.guess input::placeholder{text-transform:none}
.guess input:focus{border-color:var(--plum);outline:none}
.guess .btn{background:var(--plum);box-shadow:0 5px 0 #6A3FB0;white-space:nowrap}
.guess .btn:active{box-shadow:0 2px 0 #6A3FB0}
.guess-note{font-size:15px;color:var(--ink-soft);margin-top:8px;text-align:left}

/* Results & stats */
.result-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0}
.result-grid.three{grid-template-columns:repeat(3,1fr)}
.stat{background:#fff;border-radius:16px;box-shadow:inset 0 0 0 2px var(--line);padding:16px 8px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:34px;font-weight:400;line-height:1.1}
.stat span{color:var(--ink-soft);font-size:15px}
.best{background:var(--sun);border-radius:14px;padding:12px 16px;font-weight:700;text-align:center;margin-bottom:6px}
h3{font-size:19px;margin:22px 0 10px}
.practice{display:flex;flex-wrap:wrap;gap:8px}
.practice span{background:#fff;border-radius:10px;padding:8px 12px;box-shadow:inset 0 0 0 2px var(--line);font-weight:700;font-variant-numeric:tabular-nums}
.rank{display:flex;justify-content:space-between;padding:12px 14px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 2px var(--line);margin-bottom:8px;font-weight:700}
.rank .who-name{display:flex;align-items:center;gap:8px}
table.hs{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border-radius:16px;box-shadow:inset 0 0 0 2px var(--line);overflow:hidden}
.hs th,.hs td{padding:12px;text-align:center;font-variant-numeric:tabular-nums}
.hs th{font-size:15px;color:var(--ink-soft)}
.hs td:first-child,.hs th:first-child{text-align:left}
.hs tr+tr td{border-top:1px solid var(--line)}

/* Fact grid */
.fgrid{display:grid;grid-template-columns:repeat(13,1fr);gap:3px;background:#fff;border-radius:16px;box-shadow:inset 0 0 0 2px var(--line);padding:10px}
.fgrid div{aspect-ratio:1;display:grid;place-items:center;border-radius:6px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.fgrid .hd{color:var(--ink);font-size:15px}
.fgrid .new{background:#EEF3EF}
.fgrid .learning{background:var(--learning);color:var(--ink)}
.fgrid .mastered{background:var(--good);color:#fff}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:15px;color:var(--ink-soft)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:16px;height:16px;border-radius:4px;display:inline-block}
.axis{font-size:15px;color:var(--ink-soft);margin-bottom:8px}

/* Pokédex */
.dex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.dex-cell{border:0;background:#fff;border-radius:14px;box-shadow:inset 0 0 0 2px var(--line);padding:6px 4px 8px;text-align:center;position:relative;min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.dex-cell img{width:72px;height:72px;image-rendering:pixelated}
.dex-cell .num{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.dex-cell .nm{font-weight:700;font-size:13px;line-height:1.2}
.dex-cell.empty{background:#EEF3EF;box-shadow:none;cursor:default;justify-content:center}
.dex-cell.empty .q{font-family:var(--display);font-size:28px;color:#C3D3C7}
.dex-cell .sh{position:absolute;top:4px;right:6px;font-size:14px}
.dex-detail img{width:160px;height:160px;image-rendering:pixelated}
.dex-detail .pair{display:flex;justify-content:center;gap:8px}
.dex-detail p{color:var(--ink-soft);font-size:17px;margin-top:6px}

/* Overlays */
.overlay{position:fixed;inset:0;background:rgba(10,30,22,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.overlay.show{display:flex}
.dialog{background:var(--panel);border-radius:26px;padding:30px 26px;width:100%;max-width:440px;text-align:center;max-height:90vh;overflow:auto}
.dialog.wide{max-width:620px;text-align:left}
.dialog .btn{width:100%;margin-top:10px}
.help p,.help li{font-size:18px;line-height:1.5;margin-bottom:10px}
.help ul{padding-left:22px}
.help .eg{background:#fff;border-radius:14px;box-shadow:inset 0 0 0 2px var(--line);padding:14px 16px;margin:14px 0}
.turn-card{background:#fff;border-radius:26px;padding:30px 44px;text-align:center;font-family:var(--display);font-size:42px;line-height:1.1;box-shadow:inset 0 -8px 0 var(--pc)}
.turn-card small{display:block;font-family:var(--text);font-weight:700;font-size:17px;color:var(--ink-soft);margin-top:8px}

/* Catch */
.catch-stage{height:200px;display:grid;place-items:center;position:relative}
.ball{width:96px;height:96px;border-radius:50%;border:6px solid var(--ink);background:linear-gradient(var(--berry) 0 46%,var(--ink) 46% 54%,#fff 54%);position:relative;animation:wobble .9s ease-in-out 2}
.ball::after{content:'';position:absolute;left:50%;top:50%;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:#fff;border:6px solid var(--ink)}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-18deg)}75%{transform:rotate(18deg)}}
.sprite{width:192px;height:192px;image-rendering:pixelated;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.caught-name{font-family:var(--display);font-size:36px;line-height:1.1}
.tag{display:inline-block;background:var(--sun);border-radius:999px;padding:4px 12px;font-weight:700;font-size:15px;margin:8px 4px 0}
.tag.new{background:var(--good);color:#fff}
.caught-pts{color:var(--ink-soft);margin-top:8px;font-size:17px}

.sound{position:fixed;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:20px;display:grid;place-items:center;z-index:40}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:560px){
  body{padding:60px 10px 24px}
  .panel{padding:24px 16px;border-radius:22px}
  .menu-actions{grid-template-columns:1fr}
  .kicker{font-size:24px}
  .expr{font-size:44px}
  .ans{font-size:38px;width:110px}
  .hint{font-size:14px}
  h2{font-size:28px}
  .names,.who-list{grid-template-columns:1fr}
  .result-grid{grid-template-columns:1fr 1fr;gap:8px}
  .result-grid.three{grid-template-columns:repeat(3,1fr)}
  .stat b{font-size:28px}
  .seg span{font-size:15px;padding:10px 4px}
  .guess{flex-direction:column}
  .hud{margin-bottom:16px}
  .players{margin-bottom:14px}
  .board{padding:4px 0 18px}
  .play{padding:18px 14px}
  .pad button{height:50px}
  .clock{font-size:24px;min-width:0}
  .hud-mode{font-size:15px}
  .fgrid{gap:2px;padding:6px}
  .fgrid div{font-size:9px;border-radius:4px}
  .fgrid .hd{font-size:12px}
  .dex-grid{grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}
  .dex-cell img{width:60px;height:60px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

<section id="menu" class="screen">

</main>

</div>
<div class="overlay" id="infoOv" role="dialog" aria-modal="true" onclick="if(event.target===this)overlay('infoOv',false)">
  <div class="dialog" id="infoBody"></div>
</div>
<div class="overlay" id="turnOv" aria-live="assertive">
  <div class="turn-card" id="turnCard"></div>
</div>

function titleCase(s){return s.toLowerCase().replace(/(^|[\s.\-'])([a-z])/g,(m,a,b)=>a+b.toUpperCase()).replace("'D","'d")}
function nameOf(id){const k=POKEMON[id-1];return titleCase(DISPLAY[k]||k)}
function sprite(id,shiny){return `${SPRITE}${shiny?'shiny/':''}${id}.png`}
function seg(name,opts,val,fn){
  return `<div class="seg" role="radiogroup">${opts.map(([v,l])=>`<label><input type="radio" name="${name}" value="${v}" ${String(v)===String(val)?'checked':''} onchange="${fn||'setOpt'}('${name}',this.value)"><span>${l}</span></label>`).join('')}</div>`;
}
function localDate(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function niceDate(iso){try{return new Date(iso+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}catch(e){return iso}}

/* ---------- sound ---------- */
let soundOn=true,actx=null;
try{soundOn=localStorage.getItem('pmm_sound')!=='off'}catch(e){}
function syncSoundBtn(){const b=$('soundBtn');b.textContent=soundOn?'🔊':'🔇';b.setAttribute('aria-label',soundOn?'Turn sound off':'Turn sound on')}
function toggleSound(){soundOn=!soundOn;try{localStorage.setItem('pmm_sound',soundOn?'on':'off')}catch(e){}syncSoundBtn()}
function tone(notes){
  if(!soundOn)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    let t=actx.currentTime;
    notes.forEach(([f,d,type])=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type=type||'triangle';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+.02);t+=d*.8;
    });
  }catch(e){}
}
const sfx={
  right:()=>tone([[660,.12],[990,.18]]),
  streak:()=>tone([[660,.1],[880,.1],[1175,.2]]),
  wrong:()=>tone([[220,.22,'square']]),
  catch:()=>tone([[523,.12],[659,.12],[784,.12],[1047,.3]]),
  turn:()=>tone([[440,.1]]),
  key:()=>tone([[520,.04]])
};

/* ---------- profiles (saved on this device) ---------- */
let db={profiles:[],current:null,migrated:false};
try{const d=JSON.parse(localStorage.getItem('pmm_v2')||'null');if(d&&Array.isArray(d.profiles))db=Object.assign(db,d)}catch(e){}
function saveDb(){try{localStorage.setItem('pmm_v2',JSON.stringify(db))}catch(e){}}
function me(){return db.profiles.find(p=>p.id===db.current)||null}
function findProfile(name){const n=String(name).trim().toLowerCase();return n?db.profiles.find(p=>p.name.toLowerCase()===n)||null:null}
function freshStats(){return{games:0,solved:0,correct:0,total:0,bestStreak:0,best:{}}}
function createProfile(name){
  const used=db.profiles.map(p=>p.color);
  const color=PROFILE_COLORS.find(c=>!used.includes(c))||PROFILE_COLORS[db.profiles.length%PROFILE_COLORS.length];
  const p={id:Date.now().toString(36)+rnd(1e6).toString(36),name,color,stats:freshStats(),dex:{},facts:{}};
  if(!db.migrated){ // carry over stats from earlier versions of the game into the first player
    try{
      const s=JSON.parse(localStorage.getItem('pmm_stats')||'null');
      if(s){
        ['games','solved','correct','total'].forEach(k=>p.stats[k]=s[k]||0);
        if(s.best)p.stats.best=Object.assign({},s.best);
        else ['easy','med','hard'].forEach(d=>{if(s[d])p.stats.best['mul-'+d]=s[d]});
      }
    }catch(e){}
    db.migrated=true;
  }
  db.profiles.push(p);saveDb();return p;
}
function dexCount(p){return p?Object.keys(p.dex).length:0}

/* ---------- facts ---------- */
const ALL_FACTS={m:[],d:[]};
for(let a=1;a<=12;a++)for(let b=1;b<=12;b++){ALL_FACTS.m.push(`m:${a}:${b}`);ALL_FACTS.d.push(`d:${a}:${b}`)}
function factFromKey(key){
  const [o,x,y]=key.split(':'),a=+x,b=+y;
  return o==='m'?{key,text:`${a} × ${b}`,ans:a*b}:{key,text:`${a*b} ÷ ${a}`,ans:b};
}
function factState(p,key){const f=p&&p.facts[key];if(!f)return 'new';return f.s>=MASTERY?'mastered':'learning'}
function makeFact(op,p){
  if(op==='mix')op=Math.random()<.5?'mul':'div';
  let pool=ALL_FACTS[op==='mul'?'m':'d'];
  if(p&&Math.random()<.7){const left=pool.filter(k=>factState(p,k)!=='mastered');if(left.length)pool=left}
  return factFromKey(pool[rnd(pool.length)]);
}
function recordFact(p,key,ok){
  if(!p)return;
  const f=p.facts[key]||(p.facts[key]={r:0,w:0,s:0});
  if(ok){f.r++;f.s++}else{f.w++;f.s=0}
  saveDb();
}
function recordCatch(p,id,shiny){
  if(!p)return null;
  const had=p.dex[id];
  const e=p.dex[id]=had||{n:0,first:localDate(),shiny:false};
  const firstShiny=shiny&&!e.shiny;
  e.n++;if(shiny)e.shiny=true;
  p.stats.solved++;saveDb();
  return{isNew:!had,firstShiny,count:dexCount(p)};
}

/* ---------- who's playing ---------- */
let whoEdit=false;
function showWho(){whoEdit=false;renderWho();show('who')}
function renderWho(msg){
  const has=db.profiles.length>0;
  let h=`<h2>Who's playing?</h2><p class="sub">${has?'Pick your name.':'Add a name to start.'} Each player gets their own Pokédex and progress.</p>`;
  if(has){
    h+=`<div class="who-list">`;
    db.profiles.forEach(p=>{
      h+=`<div class="who-wrap"><button class="who" style="--pc:${p.color}" onclick="pickProfile('${p.id}')"><span class="dot"></span><span><b>${esc(p.name)}</b><small>${dexCount(p)} caught</small></span></button>${whoEdit?`<button class="who-remove" onclick="removeProfile('${p.id}')" aria-label="Remove ${esc(p.name)}">Remove</button>`:''}</div>`;
    });
    h+=`</div>`;
  }
  h+=`<div class="add-row"><input id="newName" maxlength="12" autocomplete="off" placeholder="${has?'New player name':'Your name'}" aria-label="New player name"><button class="btn btn-red btn-small" onclick="addProfile()">Add player</button></div><p class="note" id="whoMsg">${msg?esc(msg):''}</p>`;
  if(has)h+=`<div class="btn-row">${me()?`<button class="btn btn-ghost btn-small" onclick="showMenu()">Back</button>`:''}<button class="btn btn-ghost btn-small" onclick="whoEdit=!whoEdit;renderWho()">${whoEdit?'Done':'Edit players'}</button></div>`;
  $('whoBody').innerHTML=h;
  $('newName').addEventListener('keydown',e=>{if(e.key==='Enter')addProfile()});
}
function addProfile(){
  const el=$('newName');const n=el.value.trim();
  if(!n){renderWho('Type a name first.');$('newName').focus();return}
  if(findProfile(n)){renderWho(`${n} is already on the list. Tap the name to play.`);return}
  const p=createProfile(n);db.current=p.id;saveDb();showMenu();
}
function pickProfile(id){db.current=id;saveDb();showMenu()}
function removeProfile(id){
  const p=db.profiles.find(x=>x.id===id);if(!p)return;
  if(!window.confirm(`Remove ${p.name}? Their Pokédex and progress will be deleted.`))return;
  db.profiles=db.profiles.filter(x=>x.id!==id);
  if(db.current===id)db.current=null;
  saveDb();if(!db.profiles.length)whoEdit=false;renderWho();
}

/* ---------- menu ---------- */
let settings={mode:'single',op:'mul',diff:'easy',timed:true,count:2,names:['','','',''],rounds:3};
let G=null;
function showMenu(){
  const p=me();

  $('meRow').innerHTML=`<span><span class="dot" style="--pc:${p.color}"></span>Playing as <b>${esc(p.name)}</b></span><button class="link" onclick="showWho()">Switch player</button>`;

/* ---------- setup ---------- */
function openSetup(mode){
  settings.mode=mode;
  if(mode==='multi'&&!settings.names[0]&&me())settings.names[0]=me().name;
  renderSetup();show('setup');
}
function diffNote(){
  return `You get ${SOLO_TIME[settings.diff]/60} minutes. High scores count in timed games.`;
}
function setOpt(name,v){
  if(name==='timed')v=v==='true';
  if(name==='count'||name==='rounds')v=+v;
  readNames();settings[name]=v;renderSetup();
}
function readNames(){document.querySelectorAll('.names input').forEach((el,i)=>settings.names[i]=el.value)}
function renderSetup(){
  const s=settings,multi=s.mode==='multi';
  let h=`<h2>${multi?'Play with friends':'Play solo'}</h2><p class="sub">${multi?'Pick your game, then start.':`Playing as ${esc(me().name)}. Pick your game, then start.`}</p>`;
  if(multi){
    h+=`<div class="field"><span class="label">Players</span>${seg('count',[[2,'2'],[3,'3'],[4,'4']],s.count)}</div>`;

    h+=`</div><datalist id="profileNames">${db.profiles.map(p=>`<option value="${esc(p.name)}">`).join('')}</datalist><p class="note">Use a saved player's name and their catches go in their Pokédex.</p></div>`;
  }

  if(!multi&&s.timed)h+=`<div class="field"><span class="label">Difficulty</span>${seg('diff',[['easy','Easy'],['med','Medium'],['hard','Hard']],s.diff)}<p class="note">${diffNote()}</p></div>`;
  if(multi)h+=`<div class="field"><span class="label">Rounds</span>${seg('rounds',[[1,'1'],[3,'3'],[5,'5']],s.rounds)}<p class="note">Each round is one Pokémon.</p></div>`;

}

/* ---------- game flow ---------- */
function startGame(){
  clearLater();stopClock();
  const s=settings;
  const players=[];
  if(s.mode==='multi'){
    for(let i=0;i<s.count;i++){
      let n=(s.names[i]||'').trim()||`Player ${i+1}`;
      const prof=findProfile(n);if(prof)n=prof.name;
      while(players.includes(n))n+=' '+(i+1);
      players.push(n);
    }
  }
  const n=Math.max(players.length,1);
  G={
    mode:s.mode,op:s.op,diff:s.diff,timed:s.timed,rounds:s.rounds,
    players,scores:players.map(()=>0),roundScores:players.map(()=>0),active:players.map((_,i)=>i),
    links:players.map(nm=>findProfile(nm)),
    streak:Array(n).fill(0),bestStreak:Array(n).fill(0),
    cur:0,round:1,tiebreak:false,
    timeLeft:s.mode==='single'?SOLO_TIME[s.diff]:TURN_TIME,
    score:0,correct:0,total:0,solved:0,missed:[],newCatches:0,
    paused:false,busy:false,modal:false,clock:null,timeUp:false
  };
  newPuzzle();
  show('game');
  if(G.mode==='multi')beginTurn(true);
  else{renderGame();startClock()}
}
function prof(i){return G.mode==='single'?me():G.links[i]}
function newPuzzle(){
  const key=POKEMON[rnd(POKEMON.length)];
  const name=DISPLAY[key]||key;
  const letters=[...new Set([...name].filter(isLetter))];
  const facts={},used=new Set();
  const p=G.mode==='single'?me():null;
  letters.forEach(l=>{let f,tries=0;do{f=makeFact(G.op,p);tries++}while(used.has(f.key)&&tries<200);used.add(f.key);facts[l]=f});
  G.p={key,name,id:POKEMON.indexOf(key)+1,shiny:Math.random()<.05,letters,facts,revealed:new Set(),answered:new Set(),target:null,flip:null};
  G.roundScores=G.players.map(()=>0);
  pickTarget();
}
function pickTarget(){
  const left=G.p.letters.filter(l=>!G.p.revealed.has(l));
  const pool=left.length>1?left.filter(l=>l!==G.p.target):left;
  G.p.target=pool[rnd(pool.length)]||null;
}
function addPts(n){
  if(G.mode==='single')G.score+=n;
  else{G.scores[G.cur]+=n;G.roundScores[G.cur]+=n}
}
function modeLabel(){return G.mode==='single'&&G.timed?`${DIFFS[G.diff]} ${OPS[G.op].toLowerCase()}`:OPS[G.op]}
function streakBonus(s){return s>=5?10:s>=3?5:0}

/* ---------- clock ---------- */
function startClock(){
  stopClock();
  if(!G.timed)return;
  G.clock=setInterval(()=>{
    if(G.paused||G.modal||(G.mode==='multi'&&G.busy))return;
    G.timeLeft--;updateClock();
    if(G.timeLeft<=0){
      stopClock();
      if(G.mode==='single'){G.timeUp=true;endSolo()}
      else{G.busy=true;lockInputs(true);G.streak[G.cur]=0;sfx.wrong();setMsg('bad',"Time's up!");later(nextTurn,1100)}
    }
  },1000);
}
function stopClock(){if(G&&G.clock){clearInterval(G.clock);G.clock=null}}
function fmtClock(){return G.mode==='single'?`${Math.floor(G.timeLeft/60)}:${String(G.timeLeft%60).padStart(2,'0')}`:`${G.timeLeft}s`}
function updateClock(){
  const el=$('clock');if(!el)return;
  el.textContent=fmtClock();
  el.classList.toggle('warn',G.mode==='single'?G.timeLeft<=30:G.timeLeft<=3);
}

/* ---------- render ---------- */
function tilesHTML(){
  const p=G.p;
  let h='';
  [...p.name].forEach(c=>{
    if(c===' '){h+='<div class="gap"></div>';return}
    if(!isLetter(c)){h+=`<div class="slot"><div class="tile open static"><div class="face back"></div><div class="face front">${esc(c)}</div></div><div class="hint"></div></div>`;return}
    const open=p.revealed.has(c),flip=open&&p.flip===c;
    h+=`<div class="slot"><div class="tile ${open&&!flip?'open':''}" ${flip?'data-flip':''}><div class="face back"></div><div class="face front">${open?c:''}</div></div><div class="hint">${p.answered.has(c)?p.facts[c].ans:''}</div></div>`;
  });
  return h;
}
function renderGame(){
  const multi=G.mode==='multi';
  const f=G.p.target?G.p.facts[G.p.target]:null;
  const st=G.streak[G.cur]||0;
  let h=`<div class="hud"><div class="hud-left"><span class="hud-mode">${modeLabel()}${multi?`, round ${G.round}${G.tiebreak?' (tiebreaker)':` of ${G.rounds}`}`:''}</span>${st>=2?`<span class="streak">🔥 ${st} in a row</span>`:''}</div><div class="hud-right">`;
  if(G.timed)h+=`<div class="clock" id="clock" aria-label="Time left">${fmtClock()}</div>`;
  h+=`<button class="btn btn-ghost btn-small" onclick="pauseGame()">Pause</button></div></div>`;
  if(multi){
    h+=`<div class="players">`;
    G.players.forEach((n,i)=>{
      h+=`<div class="pl ${i===G.cur?'turn':''} ${G.active.includes(i)?'':'out'}" style="--pc:${PCOLORS[i]}"><span><span class="dot"></span>${esc(n)}</span><b>${G.scores[i]}</b></div>`;
    });
    h+=`</div>`;
  }else{
    h+=`<div class="players"><div class="pl"><span>Score</span><b>${G.score}</b></div><div class="pl"><span>Caught</span><b>${G.solved}</b></div></div>`;
  }
  const n=[...G.p.name].length;
  h+=`<div class="board"><div class="tiles" id="tiles" style="--tw:${tileWidth(n)}px" aria-label="Hidden Pokémon name">${tilesHTML()}</div></div>`;
  h+=`<div class="play ${TOUCH?'touch':''}" id="play">
    <div class="problem"><span class="expr" aria-label="${f?f.text.replace('×','times').replace('÷','divided by'):''}">${f?f.text:''}</span><span class="expr" aria-hidden="true">=</span>
    <input class="ans" id="ans" type="text" ${TOUCH?'inputmode="none" readonly':'inputmode="numeric"'} pattern="[0-9]*" maxlength="3" autocomplete="off" aria-label="Your answer"></div>`;
  if(TOUCH){
    h+=`<div class="pad" id="pad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button data-k="${d}">${d}</button>`).join('')}<button data-k="del" aria-label="Delete">⌫</button><button data-k="0">0</button><button data-k="ok" class="ok">Check</button></div>`;
  }else{
    h+=`<button class="btn btn-red" id="checkBtn" onclick="submitAnswer()">Check</button>`;
  }
  h+=`<p class="msg" id="msg" aria-live="polite"></p></div>
  <div class="guess"><input type="text" id="guessIn" maxlength="14" autocomplete="off" placeholder="Know who it is? Type the name" aria-label="Guess the Pokémon name"><button class="btn" id="guessBtn" onclick="submitGuess()">Guess</button></div>
  <p class="guess-note">A right guess is worth 25 bonus points.${multi?' A wrong guess ends your turn.':''}</p>`;
  if(!multi&&!G.timed)h+=`<div class="btn-row"><button class="btn btn-ghost btn-small" onclick="endSolo()">End game</button></div>`;
  $('gameBody').innerHTML=h;
  const ans=$('ans'),gi=$('guessIn');
  ans.addEventListener('keydown',e=>{if(e.key==='Enter')submitAnswer()});
  ans.addEventListener('input',()=>{ans.value=ans.value.replace(/\D/g,'')});
  gi.addEventListener('keydown',e=>{if(e.key==='Enter')submitGuess()});
  if(TOUCH)$('pad').addEventListener('click',e=>{const b=e.target.closest('button');if(b&&!b.disabled)padKey(b.dataset.k)});
  const fl=$('tiles').querySelector('[data-flip]');
  if(fl)requestAnimationFrame(()=>requestAnimationFrame(()=>fl.classList.add('open')));
  G.p.flip=null;
  if(!G.busy&&!TOUCH)ans.focus({preventScroll:true});
}
function padKey(k){
  if(!G||G.busy||G.paused)return;
  const a=$('ans');if(!a)return;
  if(k==='ok'){submitAnswer();return}
  sfx.key();
  if(k==='del')a.value=a.value.slice(0,-1);
  else if(a.value.length<3)a.value+=k;
}
function tileWidth(n){
  const avail=Math.min(window.innerWidth-56,700);
  return Math.max(26,Math.min(56,Math.floor((avail-(n-1)*8)/n)));
}
function setMsg(kind,text){const m=$('msg');if(m){m.className='msg '+kind;m.textContent=text}}
function lockInputs(on){
  ['ans','checkBtn','guessIn','guessBtn'].forEach(id=>{const el=$(id);if(el)el.disabled=on});
  document.querySelectorAll('#pad button').forEach(b=>b.disabled=on);
}

/* ---------- answering ---------- */
function submitAnswer(){
  if(!G||G.busy||G.paused||!G.p.target)return;
  const el=$('ans');const v=el.value.trim();
  if(v===''){if(!TOUCH)el.focus();return}
  G.busy=true;lockInputs(true);
  const f=G.p.facts[G.p.target],i=G.cur;
  G.total++;
  if(+v===f.ans){
    G.correct++;
    G.streak[i]++;G.bestStreak[i]=Math.max(G.bestStreak[i],G.streak[i]);
    const bonus=streakBonus(G.streak[i]);
    bonus?sfx.streak():sfx.right();
    recordFact(prof(i),f.key,true);
    const l=G.p.target;
    G.p.revealed.add(l);G.p.answered.add(l);G.p.flip=l;
    const count=[...G.p.name].filter(c=>c===l).length;
    addPts(count*10+bonus);
    const solved=G.p.letters.every(x=>G.p.revealed.has(x));
    if(!solved)pickTarget();
    const msg=`Yes! ${f.text} = ${f.ans}. +${count*10}${bonus?`, +${bonus} streak bonus`:''}`;
    if(G.mode==='multi'){renderGame();lockInputs(true);setMsg('good',msg);later(solved?puzzleSolved:nextTurn,1200)}
    else if(solved){renderGame();lockInputs(true);setMsg('good',msg);later(puzzleSolved,1000)}
    else{G.busy=false;renderGame();setMsg('good',msg)}
  }else{
    sfx.wrong();
    G.streak[i]=0;
    recordFact(prof(i),f.key,false);
    if(!G.missed.some(m=>m.key===f.key))G.missed.push(f);
    const msg=`Not quite. ${f.text} = ${f.ans}`;
    setMsg('bad',msg);
    const s=document.querySelector('.streak');if(s)s.remove();
    const play=$('play');play.classList.remove('shake');void play.offsetWidth;play.classList.add('shake');
    if(G.mode==='multi')later(nextTurn,1600);
    else later(()=>{pickTarget();G.busy=false;renderGame();setMsg('bad',msg)},1300);
  }
}
function guessMatches(g){
  const n=norm(g);
  if(n===norm(G.p.name))return true;
  return (G.p.key==='NIDORANF'||G.p.key==='NIDORANM')&&n==='NIDORAN';
}
function submitGuess(){
  if(!G||G.busy||G.paused)return;
  const el=$('guessIn');const g=el.value.trim();
  if(!g){el.focus();return}
  if(guessMatches(g)){
    G.busy=true;addPts(25);
    G.p.letters.forEach(l=>G.p.revealed.add(l));
    renderGame();lockInputs(true);
    $('tiles').querySelectorAll('.tile').forEach(t=>t.classList.add('open'));
    sfx.right();setMsg('good','You got it! +25 bonus');
    later(puzzleSolved,1100);
  }else{
    sfx.wrong();
    if(G.mode==='multi'){G.busy=true;lockInputs(true);setMsg('bad',`It's not ${g.toUpperCase()}.`);later(nextTurn,1500)}
    else{setMsg('bad',`It's not ${g.toUpperCase()}. Keep solving!`);el.value='';el.focus()}
  }
}

/* ---------- caught ---------- */
function puzzleSolved(){
  G.solved++;addPts(25);G.modal=true;
  const p=G.p,display=titleCase(p.name),owner=prof(G.cur);
  const rec=recordCatch(owner,p.id,p.shiny);
  if(rec&&rec.isNew)G.newCatches++;
  let tags='';
  if(p.shiny)tags+=`<span class="tag">✨ Shiny!</span>`;
  if(rec&&rec.isNew)tags+=`<span class="tag new">New in ${G.mode==='multi'?esc(owner.name)+"'s":'your'} Pokédex</span>`;
  else if(rec&&rec.firstShiny)tags+=`<span class="tag new">First shiny ${esc(display)}</span>`;
  const who=G.mode==='multi'?`${esc(G.players[G.cur])} caught`:'You caught';
  const dexLine=rec?`<p class="caught-pts">${rec.count} of ${POKEMON.length} in ${G.mode==='multi'?esc(owner.name)+"'s":'your'} Pokédex</p>`:'';
  $('catchBody').innerHTML=`<div class="catch-stage" id="stage"><div class="ball"></div></div><div id="caughtText" style="visibility:hidden"><div class="caught-name">${who} ${esc(display)}!</div>${tags}<p class="caught-pts">+25 for finishing the name</p>${dexLine}<button class="btn btn-red" id="contBtn" onclick="afterCatch()">Continue</button></div>`;
  overlay('catchOv',true);
  const img=new Image();img.className='sprite';img.alt=display;img.src=sprite(p.id,p.shiny);
  later(()=>{
    sfx.catch();
    const st=$('stage');st.innerHTML='';
    img.onerror=()=>{st.innerHTML='<div class="ball" style="animation:none"></div>'};
    st.appendChild(img);
    $('caughtText').style.visibility='visible';$('contBtn').focus();
  },1500);
}
function afterCatch(){
  overlay('catchOv',false);G.modal=false;
  if(G.mode==='single'){newPuzzle();G.busy=false;renderGame()}
  else roundOver();
}

/* ---------- multiplayer ---------- */
function beginTurn(first){
  if(first)G.cur=G.active[(G.round-1)%G.active.length];
  G.busy=true;G.timeLeft=TURN_TIME;stopClock();
  renderGame();lockInputs(true);
  const c=$('turnCard');c.style.setProperty('--pc',PCOLORS[G.cur]);
  c.innerHTML=`${esc(G.players[G.cur])}'s turn<small>${first?(G.tiebreak?'Tiebreaker round':`Round ${G.round}`):'Solve one fact or guess the name'}</small>`;
  overlay('turnOv',true);sfx.turn();
  later(()=>{overlay('turnOv',false);G.busy=false;renderGame();startClock()},1500);
}
function nextTurn(){
  stopClock();
  const i=G.active.indexOf(G.cur);
  G.cur=G.active[(i+1)%G.active.length];
  beginTurn(false);
}
function ranked(){return G.players.map((name,i)=>({name,i,score:G.scores[i]})).sort((a,b)=>b.score-a.score)}
function rankRow(r,prefix){return `<div class="rank"><span class="who-name">${prefix||''}<span class="dot" style="--pc:${PCOLORS[r.i]}"></span>${esc(r.name)}</span><span>${r.score}</span></div>`}
function roundOver(){
  stopClock();
  const last=G.tiebreak||G.round>=G.rounds;
  let h=`<h2 id="roundTitle">${G.tiebreak?'Tiebreaker done':`Round ${G.round} done`}</h2><h3>This round</h3>`;
  G.players.forEach((n,i)=>{if(G.active.includes(i))h+=rankRow({name:n,i,score:'+'+G.roundScores[i]})});
  h+=`<h3>Total</h3>`;
  ranked().forEach(r=>h+=rankRow(r));
  let action;
  if(!last)action=`<button class="btn btn-red" onclick="nextRound()">Start round ${G.round+1}</button>`;
  else{
    const top=Math.max(...G.active.map(i=>G.scores[i]));
    const tied=G.active.filter(i=>G.scores[i]===top);
    action=tied.length>1?`<button class="btn btn-red" onclick="tiebreaker()">Play a tiebreaker</button><p class="note" style="text-align:center">${tied.map(i=>esc(G.players[i])).join(' and ')} are tied.</p>`:`<button class="btn btn-red" onclick="endMulti()">See final results</button>`;
  }
  $('roundBody').innerHTML=h+action;
  overlay('roundOv',true);
}
function nextRound(){overlay('roundOv',false);G.round++;newPuzzle();beginTurn(true)}
function tiebreaker(){
  const top=Math.max(...G.active.map(i=>G.scores[i]));
  G.active=G.active.filter(i=>G.scores[i]===top);
  G.tiebreak=true;nextRound();
}

/* ---------- pause ---------- */
function pauseGame(){if(!G||G.modal)return;G.paused=true;overlay('pauseOv',true)}
function resumeGame(){G.paused=false;overlay('pauseOv',false);const a=$('ans');if(a&&!a.disabled&&!TOUCH)a.focus()}
function closeAllOverlays(){['pauseOv','helpOv','catchOv','roundOv','turnOv','infoOv'].forEach(id=>overlay(id,false))}
function restartGame(){if(window.confirm('Restart this game? Your progress in this game will be lost.')){closeAllOverlays();startGame()}}
function quitToMenu(){if(window.confirm('Quit to the menu? Your progress in this game will be lost. Pokémon you caught stay in your Pokédex.')){clearLater();stopClock();closeAllOverlays();G=null;showMenu()}}

/* ---------- endings ---------- */
function endSolo(){
  clearLater();stopClock();closeAllOverlays();
  const p=me(),s=p.stats,key=`${G.op}-${G.diff}`;
  const prev=s.best[key]||0;
  const isBest=G.timed&&G.score>0&&G.score>prev;
  if(isBest)s.best[key]=G.score;
  s.games++;s.correct+=G.correct;s.total+=G.total;
  const streakRecord=G.bestStreak[0]>=3&&G.bestStreak[0]>(s.bestStreak||0);
  s.bestStreak=Math.max(s.bestStreak||0,G.bestStreak[0]);
  saveDb();
  const acc=G.total?Math.round(G.correct/G.total*100)+'%':'–';
  let h=`<h2>${G.timeUp?"Time's up!":'Game over'}</h2><p class="sub">${modeLabel()}${G.timed?'':', no timer'}</p>`;
  if(isBest)h+=`<div class="best">New high score!${prev?` Your old best was ${prev}.`:''}</div>`;
  if(streakRecord)h+=`<div class="best">Longest streak ever: ${G.bestStreak[0]} in a row!</div>`;
  h+=`<div class="result-grid"><div class="stat"><b>${G.score}</b><span>Points</span></div><div class="stat"><b>${G.solved}</b><span>Caught${G.newCatches?`, ${G.newCatches} new`:''}</span></div><div class="stat"><b>${acc}</b><span>${G.correct} of ${G.total} right</span></div><div class="stat"><b>${G.bestStreak[0]}</b><span>Best streak</span></div></div>`;
  h+=practiceHTML();
  h+=`<div class="btn-row"><button class="btn btn-ghost" onclick="showMenu()">Main menu</button><button class="btn btn-ghost" onclick="openSetup(settings.mode)">Change settings</button><button class="btn btn-red" onclick="startGame()">Play again</button></div>`;
  $('endBody').innerHTML=h;show('end');
}
function endMulti(){
  clearLater();stopClock();closeAllOverlays();
  G.links.forEach((p,i)=>{if(p){p.stats.bestStreak=Math.max(p.stats.bestStreak||0,G.bestStreak[i])}});saveDb();
  const r=ranked();
  let h=`<h2>${esc(r[0].name)} wins!</h2><p class="sub">${G.round} ${G.round===1?'round':'rounds'} of ${OPS[G.op].toLowerCase()}</p>`;
  r.forEach((p,k)=>h+=rankRow(p,`${k+1}. `));
  h+=practiceHTML();
  h+=`<div class="btn-row"><button class="btn btn-ghost" onclick="showMenu()">Main menu</button><button class="btn btn-ghost" onclick="openSetup(settings.mode)">Change settings</button><button class="btn btn-red" onclick="startGame()">Play again</button></div>`;
  $('endBody').innerHTML=h;show('end');
}
function practiceHTML(){
  if(!G.missed.length)return G.total?`<h3>No missed facts. Nice!</h3>`:'';
  return `<h3>Facts to practice</h3><div class="practice">${G.missed.map(f=>`<span>${f.text} = ${f.ans}</span>`).join('')}</div>`;
}

/* ---------- Pokédex ---------- */
let dexFilter='caught';
function showDex(){if(!dexCount(me()))dexFilter='all';renderDex();show('dex')}
function setDexFilter(n,v){dexFilter=v;renderDex()}
function renderDex(){
  const p=me(),c=dexCount(p),shinies=Object.values(p.dex).filter(e=>e.shiny).length;
  let h=`<h2>${esc(p.name)}'s Pokédex</h2><p class="sub">${c} of ${POKEMON.length} caught${shinies?`, ${shinies} shiny`:''}</p>`;
  h+=seg('dexf',[['caught','Caught'],['all','All 386']],dexFilter,'setDexFilter');
  h+=`<div style="height:16px"></div>`;
  if(dexFilter==='caught'&&!c)h+=`<p style="font-size:18px">No Pokémon yet. Finish a name in any game to catch your first one.</p>`;
  else{
    h+=`<div class="dex-grid">`;
    for(let id=1;id<=POKEMON.length;id++){
      const e=p.dex[id],num='#'+String(id).padStart(3,'0');
      if(e)h+=`<button class="dex-cell" onclick="dexDetail(${id})">${e.shiny?'<span class="sh" aria-label="Shiny caught">✨</span>':''}<img loading="lazy" src="${sprite(id,false)}" alt=""><span class="nm">${esc(nameOf(id))}</span><span class="num">${num}</span></button>`;
      else if(dexFilter==='all')h+=`<div class="dex-cell empty" aria-label="${num} not caught yet"><span class="q">?</span><span class="num">${num}</span></div>`;
    }
    h+=`</div>`;
  }
  h+=`<div class="btn-row"><button class="btn btn-ghost" onclick="showMenu()">Back</button></div>`;
  $('dexBody').innerHTML=h;
}
function dexDetail(id){
  const e=me().dex[id];if(!e)return;
  $('infoBody').innerHTML=`<div class="dex-detail"><div class="pair"><img src="${sprite(id,false)}" alt="${esc(nameOf(id))}">${e.shiny?`<img src="${sprite(id,true)}" alt="Shiny ${esc(nameOf(id))}">`:''}</div>
  <div class="caught-name">${esc(nameOf(id))}</div><p>#${String(id).padStart(3,'0')}${e.shiny?', shiny caught too':''}</p>
  <p>Caught ${e.n} ${e.n===1?'time':'times'}. First caught ${niceDate(e.first)}.</p>
  <button class="btn btn-red" onclick="overlay('infoOv',false)">Close</button></div>`;
  overlay('infoOv',true);
}

/* ---------- progress ---------- */
let progTab='facts',progOp='m';
function showProgress(){renderProgress();show('progress')}
function setProg(n,v){if(n==='tab')progTab=v;else progOp=v;renderProgress()}
function renderProgress(){
  const p=me();
  let h=`<h2>${esc(p.name)}'s progress</h2><p class="sub">Saved on this device.</p>`;
  h+=seg('tab',[['facts','Facts'],['stats','Stats']],progTab,'setProg');
  if(progTab==='facts'){
    const keys=ALL_FACTS[progOp];
    const m=keys.filter(k=>factState(p,k)==='mastered').length;
    h+=`<div class="field">${seg('op',[['m','× Multiply'],['d','÷ Divide']],progOp,'setProg')}</div>`;
    h+=`<h3>${m} of ${keys.length} facts mastered</h3>`;
    h+=`<p class="axis">${progOp==='m'?'Each square is one fact, like 7 × 8 (row 7, column 8).':'Rows are what you divide by, columns are the answer. The square shows the starting number, so row 7, column 8 is 56 ÷ 7.'}</p>`;
    h+=`<div class="fgrid" role="img" aria-label="${m} of ${keys.length} facts mastered"><div class="hd">${progOp==='m'?'×':'÷'}</div>`;
    for(let b=1;b<=12;b++)h+=`<div class="hd">${b}</div>`;
    for(let a=1;a<=12;a++){
      h+=`<div class="hd">${a}</div>`;
      for(let b=1;b<=12;b++){const k=`${progOp}:${a}:${b}`;h+=`<div class="${factState(p,k)}">${a*b}</div>`}
    }
    h+=`</div><div class="legend"><span><i style="background:var(--good)"></i>Mastered: ${MASTERY} right in a row</span><span><i style="background:var(--learning)"></i>Still learning</span><span><i style="background:#EEF3EF"></i>Not seen yet</span></div>`;
    h+=`<p class="note">Solo games give you more of the facts you haven't mastered yet.</p>`;
  }else{
    const s=p.stats,acc=s.total?Math.round(s.correct/s.total*100)+'%':'–';
    h+=`<div class="result-grid"><div class="stat"><b>${s.games}</b><span>Solo games</span></div><div class="stat"><b>${dexCount(p)}</b><span>In Pokédex</span></div><div class="stat"><b>${acc}</b><span>Accuracy</span></div><div class="stat"><b>${s.bestStreak||0}</b><span>Best streak</span></div></div>`;
    h+=`<h3>High scores in timed games</h3><table class="hs"><tr><th></th><th>Easy</th><th>Medium</th><th>Hard</th></tr>`;
    ['mul','div','mix'].forEach(o=>{h+=`<tr><td><b>${OPS[o]}</b></td>${['easy','med','hard'].map(d=>`<td>${s.best[o+'-'+d]||'–'}</td>`).join('')}</tr>`});
    h+=`</table>`;
  }
  h+=`<div class="btn-row"><button class="btn btn-ghost" onclick="showMenu()">Back</button></div>`;
  $('progressBody').innerHTML=h;
}

/* ---------- help ---------- */
let helpFromPause=false;
function openHelp(fromPause){
  helpFromPause=!!fromPause;
  if(fromPause)overlay('pauseOv',false);
  $('helpBody').innerHTML=`<h2 id="helpTitle">How to play</h2>
  <p>A Pokémon's name is hidden under the grass tiles. Every letter has its own math fact. Solve the fact on screen to flip that letter over.</p>
  <div class="eg">Say the Pokémon is <b>PIKACHU</b> and you get <b>56 ÷ 7</b>. Answer <b>8</b> and a letter flips, like the <b>K</b>. If a letter shows up twice, both copies flip.</div>
  <ul>
    <li><b>10 points</b> for each letter you flip</li>
    <li><b>Streak bonus:</b> +5 for 3 right in a row, +10 once you hit 5</li>
    <li><b>25 points</b> for finishing the name</li>
    <li><b>25 bonus points</b> for guessing the name before it's done</li>
  </ul>
  <p>Every Pokémon you finish goes in your Pokédex. Miss a fact and you'll see the right answer, and that fact comes back later.</p>
  <p>When you solve a fact, its answer shows up under the letter so you can see what you've solved. In timed solo games, Easy gives you 5 minutes, Medium 3 and Hard 2.</p>
  <p>With friends, each turn you solve one fact or make one guess. Each round is one Pokémon.</p>
  <button class="btn btn-red" onclick="closeHelp()">${helpFromPause?'Back to game':'Got it'}</button>`;
  overlay('helpOv',true);
}
function closeHelp(){overlay('helpOv',false);if(helpFromPause)overlay('pauseOv',true)}

/* ---------- init ---------- */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if($('infoOv').classList.contains('show'))overlay('infoOv',false);
    else if($('helpOv').classList.contains('show'))closeHelp();
    else if($('pauseOv').classList.contains('show'))resumeGame();
    return;
  }
  // a hardware keyboard still works on touch screens
  if(TOUCH&&G&&$('game').classList.contains('active')&&document.activeElement!==$('guessIn')&&!document.querySelector('.overlay.show')){
    if(/^[0-9]$/.test(e.key))padKey(e.key);
    else if(e.key==='Backspace'){e.preventDefault();padKey('del')}
    else if(e.key==='Enter')padKey('ok');
  }
});
window.addEventListener('resize',()=>{fitTitle();const t=$('tiles');if(t&&G)t.style.setProperty('--tw',tileWidth([...G.p.name].length)+'px')});
syncSoundBtn();renderTitle();showMenu();
</script>
</body>
</html>
